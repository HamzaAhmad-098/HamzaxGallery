<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamzax Family Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0f;
      color: #f0ede8;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    /* Login screen */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #1a1a24, #0a0a0f);
    }
    .login-card {
      background: #13131a;
      border: 1px solid #2a2a38;
      border-radius: 32px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .lock-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: rgba(201,169,110,0.08);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: #c9a96e;
    }
    h1 span {
      color: #f0ede8;
    }
    .sub {
      margin: 12px 0 32px;
      color: #7a7a8c;
      font-size: 14px;
    }
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      background: #1c1c26;
      border: 1px solid #2a2a38;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      letter-spacing: 0.5px;
      outline: none;
      transition: 0.2s;
    }
    input:focus {
      border-color: #c9a96e;
      box-shadow: 0 0 0 3px rgba(201,169,110,0.1);
    }
    .toggle-pw {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #7a7a8c;
      cursor: pointer;
    }
    button {
      background: #c9a96e;
      color: #0a0a0f;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }
    button:hover {
      background: #d4b37a;
      transform: translateY(-1px);
    }
    .error {
      color: #e05555;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .error.show {
      display: block;
    }
    /* App shell */
    #app {
      display: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      border-bottom: 1px solid #2a2a38;
      background: #13131a;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-size: 22px;
      font-weight: 500;
      color: #c9a96e;
    }
    .logo span {
      color: white;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .session-badge {
      background: #1c1c26;
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #7a7a8c;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #2a2a38;
      color: #7a7a8c;
      width: auto;
      padding: 6px 14px;
      font-size: 13px;
    }
    .logout-btn:hover {
      border-color: #e05555;
      color: #e05555;
      background: transparent;
      transform: none;
    }
    .stats-bar {
      display: flex;
      border-bottom: 1px solid #2a2a38;
      background: #13131a;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 12px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #c9a96e;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #7a7a8c;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 28px;
      border-bottom: 1px solid #2a2a38;
    }
    .filters {
      display: flex;
      gap: 8px;
    }
    .chip {
      background: transparent;
      border: 1px solid #2a2a38;
      color: #7a7a8c;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 13px;
      width: auto;
    }
    .chip.active {
      background: rgba(201,169,110,0.15);
      border-color: #c9a96e;
      color: #c9a96e;
    }
    .search-box {
      position: relative;
    }
    .search-box input {
      padding: 8px 14px 8px 36px;
      width: 220px;
      background: #1c1c26;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #7a7a8c;
      pointer-events: none;
    }
    .view-toggle {
      display: flex;
      gap: 6px;
    }
    .view-btn {
      background: #1c1c26;
      border: 1px solid #2a2a38;
      width: 36px;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .view-btn.active {
      border-color: #c9a96e;
      color: #c9a96e;
    }
    /* Gallery grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      padding: 28px;
    }
    .gallery-grid.list-view {
      grid-template-columns: 1fr;
    }
    .card {
      background: #13131a;
      border: 1px solid #2a2a38;
      border-radius: 20px;
      overflow: hidden;
      transition: 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #3a3a4a;
    }
    .card.sel {
      border-color: #c9a96e;
      box-shadow: 0 0 0 2px rgba(201,169,110,0.3);
    }
    .thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: #1c1c26;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
    }
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
    }
    .check {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 26px;
      height: 26px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .card.sel .check {
      background: #c9a96e;
      color: black;
    }
    .info {
      padding: 14px;
    }
    .filename {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .meta {
      font-size: 11px;
      color: #7a7a8c;
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn-sm {
      background: #1c1c26;
      border: 1px solid #2a2a38;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      width: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-sm.primary {
      background: rgba(201,169,110,0.1);
      border-color: rgba(201,169,110,0.3);
      color: #c9a96e;
    }
    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    #lightbox.open {
      display: flex;
    }
    .lb-header {
      display: flex;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a38;
    }
    .lb-media {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lb-media video, .lb-media img {
      max-width: 92vw;
      max-height: 80vh;
      border-radius: 16px;
    }
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 28px;
    }
    #lb-prev { left: 20px; }
    #lb-next { right: 20px; }
    .selection-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #13131a;
      border: 1px solid #2a2a38;
      border-radius: 60px;
      padding: 10px 20px;
      display: flex;
      gap: 16px;
      z-index: 200;
      display: none;
    }
    .selection-bar.show {
      display: flex;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1c1c26;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 300;
      transform: translateY(100px);
      opacity: 0;
      transition: 0.2s;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .dl-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #c9a96e;
      color: black;
      padding: 12px;
      text-align: center;
      z-index: 400;
      transform: translateY(-100%);
      transition: 0.2s;
    }
    .dl-bar.show {
      transform: translateY(0);
    }
    @media (max-width: 640px) {
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; padding: 16px; }
      .toolbar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <h1>Hamzax <span>Gallery</span></h1>
    <div class="sub">Private family gallery — password protected</div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Enter password" autocomplete="off">
      <button class="toggle-pw" onclick="togglePassword()">👁️</button>
    </div>
    <button id="login-btn" onclick="login()">Enter Gallery</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="dl-bar" id="dl-bar"><span>⬇️ Downloading...</span></div>
  <header>
    <div class="logo">Hamzax <span>Gallery</span></div>
    <div class="header-right">
      <div class="session-badge" id="session-timer">Session: --h --m</div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>
  <div class="stats-bar">
    <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" id="stat-photos">0</div><div class="stat-label">Photos</div></div>
    <div class="stat"><div class="stat-value" id="stat-videos">0</div><div class="stat-label">Videos</div></div>
    <div class="stat"><div class="stat-value" id="stat-size">0 MB</div><div class="stat-label">Size</div></div>
  </div>
  <div class="toolbar">
    <div class="filters">
      <button class="chip active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="chip" data-filter="photos" onclick="setFilter('photos')">Photos</button>
      <button class="chip" data-filter="videos" onclick="setFilter('videos')">Videos</button>
      <button class="chip" data-filter="4k" onclick="setFilter('4k')">4K</button>
      <button class="chip" data-filter="hd" onclick="setFilter('hd')">HD</button>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search..." oninput="render()">
    </div>
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('grid')">▦</button>
      <button class="view-btn" onclick="setView('list')">☰</button>
    </div>
  </div>
  <div class="gallery-grid" id="gallery"></div>
  <div class="selection-bar" id="selection-bar">
    <span id="selected-count">0 selected</span>
    <button class="btn-sm" onclick="clearSelection()">Clear</button>
    <button class="btn-sm primary" onclick="downloadSelected()">Download all</button>
  </div>
</div>

<div id="lightbox">
  <div class="lb-header">
    <div><strong id="lb-title"></strong> <span id="lb-meta"></span></div>
    <button class="btn-sm" onclick="closeLightbox()">✕ Close</button>
  </div>
  <div class="lb-media" id="lb-media"></div>
  <div id="lb-prev" class="lb-nav" onclick="prevMedia()">‹</div>
  <div id="lb-next" class="lb-nav" onclick="nextMedia()">›</div>
</div>
<div class="toast" id="toast"></div>

<script>
  // ========== CONFIG ==========
  const WORKER = 'https://gentle-bread-3cb2.jhaji1223.workers.dev';

  // ========== STATE ==========
  let sessionToken = null;
  let sessionExpiry = 0;
  let allItems = [];
  let filteredItems = [];
  let selected = new Set();
  let currentFilter = 'all';
  let currentView = 'grid';
  let searchTerm = '';
  let currentLightboxIndex = 0;
  let sessionInterval = null;

  // ========== HELPERS ==========
  function authHeaders() {
    return { 'Authorization': `Bearer ${sessionToken}` };
  }

  function fmtSize(bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
    return (bytes/1073741824).toFixed(1) + ' GB';
  }

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = isError ? '#e05555' : '#1c1c26';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function showDownloadBar(show) {
    const bar = document.getElementById('dl-bar');
    bar.classList.toggle('show', show);
  }

  // ========== SESSION ==========
  function saveSession(token, expiryMs) {
    sessionToken = token;
    sessionExpiry = Date.now() + expiryMs * 1000;
    sessionStorage.setItem('gallery_session', JSON.stringify({ token, expiry: sessionExpiry }));
    if (sessionInterval) clearInterval(sessionInterval);
    sessionInterval = setInterval(() => {
      const left = Math.max(0, sessionExpiry - Date.now());
      const hours = Math.floor(left / 3600000);
      const mins = Math.floor((left % 3600000) / 60000);
      document.getElementById('session-timer').innerText = `Session: ${hours}h ${mins}m`;
      if (left <= 0) logout();
    }, 30000);
  }

  function getStoredSession() {
    try {
      const stored = JSON.parse(sessionStorage.getItem('gallery_session'));
      if (stored && stored.expiry > Date.now()) {
        sessionToken = stored.token;
        sessionExpiry = stored.expiry;
        return true;
      }
    } catch(e) {}
    return false;
  }

  function logout() {
    sessionToken = null;
    sessionExpiry = 0;
    sessionStorage.removeItem('gallery_session');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    if (sessionInterval) clearInterval(sessionInterval);
  }

  // ========== LOGIN ==========
  async function login() {
    const pw = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const errDiv = document.getElementById('login-error');
    errDiv.classList.remove('show');
    btn.disabled = true;
    btn.innerText = 'Verifying...';
    try {
      const res = await fetch(`${WORKER}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Wrong password');
      saveSession(data.token, data.expiresIn);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadMedia();
    } catch (err) {
      errDiv.innerText = err.message;
      errDiv.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Enter Gallery';
    }
  }

  function togglePassword() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  // ========== LOAD MEDIA (via Worker /list) ==========
  async function loadMedia() {
    const galleryDiv = document.getElementById('gallery');
    galleryDiv.innerHTML = '<div style="text-align:center;padding:60px">Loading gallery...</div>';
    try {
      const res = await fetch(`${WORKER}/list`, { headers: authHeaders() });
      if (res.status === 401) { logout(); return; }
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      allItems = data.items || [];
      updateStats();
      render();
      startLazyLoading();
    } catch (err) {
      galleryDiv.innerHTML = `<div style="text-align:center;padding:60px;color:#e05555">Failed to load: ${err.message}</div>`;
    }
  }

  function updateStats() {
    const photos = allItems.filter(i => i.type === 'image').length;
    const videos = allItems.filter(i => i.type === 'video').length;
    const totalSize = allItems.reduce((sum, i) => sum + (i.size || 0), 0);
    document.getElementById('stat-total').innerText = allItems.length;
    document.getElementById('stat-photos').innerText = photos;
    document.getElementById('stat-videos').innerText = videos;
    document.getElementById('stat-size').innerText = fmtSize(totalSize);
  }

  // ========== FILTER & RENDER ==========
  function getFiltered() {
    const searchLower = document.getElementById('search').value.toLowerCase();
    return allItems.filter(item => {
      if (currentFilter === 'photos' && item.type !== 'image') return false;
      if (currentFilter === 'videos' && item.type !== 'video') return false;
      if (currentFilter === '4k' && item.res !== '4K') return false;
      if (currentFilter === 'hd' && item.res !== 'HD') return false;
      if (searchLower && !item.name.toLowerCase().includes(searchLower)) return false;
      return true;
    });
  }

  function render() {
    filteredItems = getFiltered();
    const gallery = document.getElementById('gallery');
    gallery.className = `gallery-grid ${currentView === 'list' ? 'list-view' : ''}`;
    if (filteredItems.length === 0) {
      gallery.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px">No files found</div>';
      return;
    }
    gallery.innerHTML = filteredItems.map((item, idx) => `
      <div class="card ${selected.has(item.id) ? 'sel' : ''}" data-id="${item.id}" data-index="${idx}">
        <div class="thumb" data-idx="${idx}">
          <div class="thumb-skeleton" style="position:absolute;inset:0;background:#1c1c26"></div>
          <img data-src="${WORKER}${item.thumbPath}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;opacity:0;transition:0.2s">
          ${item.type === 'video' ? '<div class="play-overlay">▶️</div>' : ''}
          <div class="badge">${item.res === '4K' ? '4K' : (item.type === 'video' ? 'VIDEO' : 'HD')}</div>
          <div class="check" onclick="event.stopPropagation(); toggleSelect('${item.id}')">${selected.has(item.id) ? '✓' : ''}</div>
        </div>
        <div class="info">
          <div class="filename">${escapeHtml(item.name)}</div>
          <div class="meta"><span>${fmtSize(item.size)}</span><span>${item.date}</span></div>
          <div class="actions">
            <button class="btn-sm" onclick="openLightbox(${idx})">👁️ View</button>
            <button class="btn-sm primary" onclick="downloadItem('${item.id}')">⬇️ Download</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ========== LAZY LOADING WITH AUTH (no 401) ==========
  let lazyObserver = null;
  function startLazyLoading() {
    if (lazyObserver) lazyObserver.disconnect();
    lazyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const img = entry.target;
        const src = img.dataset.src;
        if (!src) return;
        // Fetch with auth header, then set blob URL
        fetch(src, { headers: authHeaders() })
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.blob();
          })
          .then(blob => {
            const blobUrl = URL.createObjectURL(blob);
            img.src = blobUrl;
            img.style.opacity = '1';
            img.onload = () => URL.revokeObjectURL(blobUrl);
            // remove skeleton
            const skeleton = img.parentElement?.querySelector('.thumb-skeleton');
            if (skeleton) skeleton.remove();
          })
          .catch(err => {
            console.warn('Thumb load error', src, err);
            img.style.opacity = '0.3';
          });
        lazyObserver.unobserve(img);
      });
    }, { rootMargin: '200px' });
    document.querySelectorAll('#gallery img[data-src]').forEach(img => lazyObserver.observe(img));
  }

  // ========== LIGHTBOX (full-res with auth) ==========
  async function openLightbox(index) {
    currentLightboxIndex = index;
    const item = filteredItems[index];
    if (!item) return;
    const lb = document.getElementById('lightbox');
    const title = document.getElementById('lb-title');
    const meta = document.getElementById('lb-meta');
    title.innerText = item.name;
    meta.innerText = `${item.res} · ${fmtSize(item.size)} · ${item.date}`;
    const mediaDiv = document.getElementById('lb-media');
    mediaDiv.innerHTML = '<div style="text-align:center">Loading...</div>';
    lb.classList.add('open');
    // fetch full media with auth
    const mediaUrl = `${WORKER}${item.mediaPath}`;
    try {
      if (item.type === 'video') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.style.maxWidth = '92vw';
        video.style.maxHeight = '80vh';
        video.style.borderRadius = '16px';
        const resp = await fetch(mediaUrl, { headers: authHeaders() });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const blob = await resp.blob();
        const blobUrl = URL.createObjectURL(blob);
        video.src = blobUrl;
        video.onended = () => URL.revokeObjectURL(blobUrl);
        mediaDiv.innerHTML = '';
        mediaDiv.appendChild(video);
        video.play().catch(e => console.log('autoplay blocked'));
      } else {
        const img = document.createElement('img');
        img.style.maxWidth = '92vw';
        img.style.maxHeight = '80vh';
        const resp = await fetch(mediaUrl, { headers: authHeaders() });
        const blob = await resp.blob();
        const blobUrl = URL.createObjectURL(blob);
        img.src = blobUrl;
        img.onload = () => URL.revokeObjectURL(blobUrl);
        mediaDiv.innerHTML = '';
        mediaDiv.appendChild(img);
      }
    } catch (err) {
      mediaDiv.innerHTML = `<div style="color:#e05555">Failed to load media: ${err.message}</div>`;
    }
    updateNavButtons();
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lb-media').innerHTML = '';
  }

  function prevMedia() {
    if (currentLightboxIndex > 0) openLightbox(currentLightboxIndex - 1);
  }
  function nextMedia() {
    if (currentLightboxIndex < filteredItems.length - 1) openLightbox(currentLightboxIndex + 1);
  }
  function updateNavButtons() {
    document.getElementById('lb-prev').style.display = currentLightboxIndex > 0 ? 'flex' : 'none';
    document.getElementById('lb-next').style.display = currentLightboxIndex < filteredItems.length-1 ? 'flex' : 'none';
  }

  // ========== DOWNLOAD ==========
  async function downloadItem(id) {
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    showDownloadBar(true);
    try {
      const res = await fetch(`${WORKER}${item.dlPath}`, { headers: authHeaders() });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = item.filename;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast(`Downloaded ${item.name}`);
    } catch (err) {
      showToast(`Download failed: ${err.message}`, true);
    } finally {
      showDownloadBar(false);
    }
  }

  async function downloadSelected() {
    for (let id of selected) {
      await downloadItem(id);
      await new Promise(r => setTimeout(r, 500));
    }
    clearSelection();
  }

  // ========== SELECTION ==========
  function toggleSelect(id) {
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);
    render();
    const bar = document.getElementById('selection-bar');
    const countSpan = document.getElementById('selected-count');
    const count = selected.size;
    if (count > 0) {
      bar.classList.add('show');
      countSpan.innerText = `${count} selected`;
    } else {
      bar.classList.remove('show');
    }
  }
  function clearSelection() {
    selected.clear();
    render();
    document.getElementById('selection-bar').classList.remove('show');
  }

  // ========== UI CONTROLS ==========
  function setFilter(type) {
    currentFilter = type;
    document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
    document.querySelector(`.chip[data-filter="${type}"]`).classList.add('active');
    render();
    startLazyLoading();
  }
  function setView(view) {
    currentView = view;
    document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
    if (view === 'grid') document.querySelector('.view-btn:first-child').classList.add('active');
    else document.querySelector('.view-btn:last-child').classList.add('active');
    render();
    startLazyLoading();
  }

  // ========== INIT ==========
  (function init() {
    if (getStoredSession()) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadMedia();
    }
  })();
</script>
</body>
</html>
