<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hamzax Family Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --surface:#13131a;
  --surface2:#1c1c26;
  --border:#2a2a38;
  --accent:#c9a96e;
  --accent2:#7c6fcd;
  --text:#f0ede8;
  --muted:#7a7a8c;
  --danger:#e05555;
  --success:#4caf7d;
  --r:12px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── LOGIN SCREEN ─── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}
.login-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:48px 40px;width:100%;max-width:400px;
  text-align:center;
}
.login-logo{
  font-family:'Playfair Display',serif;font-size:28px;
  color:var(--accent);margin-bottom:6px;
}
.login-logo span{color:var(--text);font-weight:400}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.6}
.login-lock{
  width:56px;height:56px;margin:0 auto 24px;
  background:rgba(201,169,110,0.1);border-radius:16px;
  display:flex;align-items:center;justify-content:center;
}
.login-lock svg{width:26px;height:26px;color:var(--accent)}
.login-input{
  width:100%;padding:13px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;
  text-align:center;letter-spacing:0.12em;outline:none;
  transition:border 0.2s;margin-bottom:14px;
}
.login-input:focus{border-color:var(--accent)}
.login-input::placeholder{letter-spacing:0;color:var(--muted)}
.login-btn{
  width:100%;padding:13px;border-radius:12px;
  background:var(--accent);color:#0a0a0f;
  border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
}
.login-btn:hover{background:#d4b37a;transform:translateY(-1px)}
.login-error{
  margin-top:12px;font-size:13px;color:var(--danger);
  display:none;
}
.login-error.show{display:block}

/* ─── MAIN APP ─── */
#app{display:none}

/* HEADER */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;border-bottom:1px solid var(--border);
  background:var(--surface);position:sticky;top:0;z-index:100;
  flex-wrap:wrap;gap:12px;
}
.logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent)}
.logo span{color:var(--text);font-weight:400}
.nav-tabs{display:flex;gap:3px;background:var(--surface2);border-radius:10px;padding:3px}
.nav-tab{
  padding:7px 16px;border-radius:8px;border:none;
  background:transparent;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
}
.nav-tab.active{background:var(--accent);color:#0a0a0f}
.logout-btn{
  padding:7px 14px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;
  font-size:13px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;
}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}

/* STATS */
.stats-bar{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  background:var(--surface);padding:0 28px;flex-wrap:wrap;
}
.stat{padding:12px 20px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.stat:first-child{padding-left:0}
.stat-val{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent)}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:12px;padding:14px 28px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:320px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search-input{
  width:100%;padding:8px 11px 8px 34px;
  border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:13px;outline:none;
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;
  font-size:12px;cursor:pointer;transition:all 0.2s;
}
.chip.active{background:var(--accent2);color:var(--text);border-color:var(--accent2)}
.view-toggle{display:flex;gap:3px;background:var(--surface2);border-radius:8px;padding:3px;margin-left:auto}
.vbtn{
  padding:5px 9px;border-radius:6px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;
}
.vbtn.active{background:var(--border);color:var(--text)}
.vbtn svg{width:15px;height:15px;display:block}

/* GALLERY */
.gallery-wrap{padding:0 28px 40px}
.section-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 12px;
}
.section-title{font-family:'Playfair Display',serif;font-size:17px}
.section-badge{
  font-size:12px;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border);
  padding:3px 10px;border-radius:20px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.grid.list{grid-template-columns:1fr}

/* CARD */
.card{
  background:var(--surface2);border-radius:var(--r);border:1px solid var(--border);
  overflow:hidden;cursor:pointer;transition:all 0.22s;position:relative;
}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 28px rgba(201,169,110,0.1)}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--surface)}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s}
.card:hover .thumb-wrap img{transform:scale(1.03)}
.play-over{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.3);
}
.play-over svg{width:46px;height:46px;color:rgba(255,255,255,0.9);filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5))}
.badge{
  position:absolute;top:8px;right:8px;
  padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;
}
.badge-4k{background:rgba(124,111,205,0.9);color:#e8e4ff}
.badge-hd{background:rgba(201,169,110,0.9);color:#1a1200}
.badge-vid{background:rgba(220,60,60,0.9);color:#fff}
.chk{
  position:absolute;top:8px;left:8px;width:22px;height:22px;
  border-radius:6px;border:2px solid rgba(255,255,255,0.55);
  background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.2s;
}
.card:hover .chk,.card.sel .chk{opacity:1}
.card.sel .chk{background:var(--accent);border-color:var(--accent)}
.card.sel .chk svg{display:block}
.chk svg{display:none;width:12px;height:12px;color:#0a0a0f}
.card-info{padding:10px 12px}
.card-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center}
.card-actions{display:flex;gap:4px;margin-top:8px}
.ca-btn{
  flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;
  font-size:11px;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.ca-btn:hover{color:var(--text);border-color:var(--muted)}
.ca-btn.primary:hover{color:#0a0a0f;background:var(--accent);border-color:var(--accent)}
.ca-btn svg{width:12px;height:12px}

/* LIST VIEW */
.grid.list .card{display:flex;align-items:stretch}
.grid.list .thumb-wrap{width:90px;flex-shrink:0;aspect-ratio:unset;height:66px}
.grid.list .card-info{flex:1;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.grid.list .card-actions{margin-top:6px}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:70px 20px}
.empty svg{width:56px;height:56px;color:var(--muted);margin:0 auto 14px;display:block}
.empty h3{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);line-height:1.6}

/* ─── LIGHTBOX ─── */
#lb{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(4,4,8,0.97);
  flex-direction:column;align-items:center;justify-content:center;
}
#lb.open{display:flex}
.lb-bar{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  background:linear-gradient(to bottom,rgba(4,4,8,0.96) 0%,transparent 100%);
}
.lb-info{display:flex;flex-direction:column;gap:3px}
.lb-name{font-size:15px;font-weight:500}
.lb-meta{font-size:12px;color:var(--muted)}
.lb-acts{display:flex;gap:8px}
.lb-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:rgba(19,19,26,0.8);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;
}
.lb-btn:hover{background:var(--border)}
.lb-btn svg{width:17px;height:17px}
.lb-download-btn{
  display:flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:10px;
  background:var(--accent);color:#0a0a0f;
  border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
}
.lb-download-btn:hover{background:#d4b37a}
.lb-download-btn svg{width:15px;height:15px}
#lb-media-wrap{display:flex;align-items:center;justify-content:center;max-width:92vw;max-height:80vh}
#lb-media-wrap img{max-width:92vw;max-height:80vh;border-radius:10px;object-fit:contain;display:block}
#lb-media-wrap video{max-width:92vw;max-height:80vh;border-radius:10px;outline:none;display:block;background:#000}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
  color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.2s;
}
.lb-nav:hover{background:rgba(255,255,255,0.14)}
.lb-nav svg{width:20px;height:20px}
#lb-prev{left:14px}#lb-next{right:14px}
.lb-footer{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:16px;background:linear-gradient(to top,rgba(4,4,8,0.96) 0%,transparent 100%);
}
.lb-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);cursor:pointer;transition:all 0.2s}
.lb-dot.active{background:var(--accent);width:16px;border-radius:3px}
/* Video quality badge in lightbox */
.lb-quality{
  position:absolute;bottom:70px;right:20px;
  background:rgba(19,19,26,0.9);border:1px solid var(--border);
  border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.lb-quality-dot{width:7px;height:7px;border-radius:50%;background:var(--success)}

/* ─── SELECTION BAR ─── */
#sel-bar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:10px 18px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 28px rgba(0,0,0,0.5);
  opacity:0;pointer-events:none;transition:all 0.22s;z-index:200;white-space:nowrap;
}
#sel-bar.on{opacity:1;pointer-events:all}
.sel-n{font-size:13px;font-weight:500}
.sdiv{width:1px;height:18px;background:var(--border)}
.sact{
  padding:6px 12px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;
  font-size:12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px;
}
.sact:hover{color:var(--text);border-color:var(--muted)}
.sact.dl:hover{color:#0a0a0f;background:var(--accent);border-color:var(--accent)}
.sact svg{width:14px;height:14px}
.scancel{color:var(--muted);background:none;border:none;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif}
.scancel:hover{color:var(--text)}

/* LOADING SPINNER */
.spinner{
  display:inline-block;width:20px;height:20px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}

/* TOAST */
.toast{
  position:fixed;bottom:70px;right:20px;z-index:600;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 18px;font-size:13px;
  display:flex;align-items:center;gap:8px;
  transform:translateY(20px);opacity:0;
  transition:all 0.25s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.toast.show{transform:translateY(0);opacity:1}
.toast-icon{width:16px;height:16px}
.toast.ok .toast-icon{color:var(--success)}
.toast.err .toast-icon{color:var(--danger)}

/* RESPONSIVE */
@media(max-width:600px){
  header{padding:12px 16px}
  .gallery-wrap{padding:0 16px 32px}
  .toolbar{padding:10px 16px}
  .stats-bar{padding:0 16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .lb-download-btn span{display:none}
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-lock">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path stroke-linecap="round" d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>
    <div class="login-logo">Hamzax <span>Gallery</span></div>
    <div class="login-sub">Family private gallery<br/>Enter the password to view photos &amp; videos</div>
    <input class="login-input" id="pw-input" type="password" placeholder="Enter password" autocomplete="off"
      onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Enter Gallery</button>
    <div class="login-error" id="login-err">Wrong password. Please try again.</div>
  </div>
</div>

<!-- ═══════════ MAIN APP ═══════════ -->
<div id="app">

  <header>
    <div class="logo">Hamzax <span>Gallery</span></div>
    <nav class="nav-tabs" id="nav">
      <button class="nav-tab active" data-tab="all" onclick="setTab(this)">All</button>
      <button class="nav-tab" data-tab="photos" onclick="setTab(this)">Photos</button>
      <button class="nav-tab" data-tab="videos" onclick="setTab(this)">Videos</button>
    </nav>
    <button class="logout-btn" onclick="logout()">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14">
        <path stroke-linecap="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      Logout
    </button>
  </header>

  <div class="stats-bar">
    <div class="stat"><span class="stat-val" id="s-total">—</span><span class="stat-label">Files</span></div>
    <div class="stat"><span class="stat-val" id="s-photos">—</span><span class="stat-label">Photos</span></div>
    <div class="stat"><span class="stat-val" id="s-videos">—</span><span class="stat-label">Videos</span></div>
    <div class="stat"><span class="stat-val" id="s-size">—</span><span class="stat-label">Total size</span></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
      </svg>
      <input class="search-input" id="search" placeholder="Search files…" oninput="render()"/>
    </div>
    <div class="chips">
      <button class="chip active" data-f="all" onclick="setFilter(this)">All</button>
      <button class="chip" data-f="4k" onclick="setFilter(this)">4K</button>
      <button class="chip" data-f="hd" onclick="setFilter(this)">HD</button>
    </div>
    <div class="view-toggle" style="margin-left:auto">
      <button class="vbtn active" id="vg" onclick="setView('grid')" title="Grid">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="vbtn" id="vl" onclick="setView('list')" title="List">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <div class="gallery-wrap">
    <div class="section-hdr">
      <span class="section-title" id="sec-title">All Media</span>
      <span class="section-badge" id="sec-count">0 items</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ═══════════ LIGHTBOX ═══════════ -->
<div id="lb">
  <div class="lb-bar">
    <div class="lb-info">
      <div class="lb-name" id="lb-name"></div>
      <div class="lb-meta" id="lb-meta"></div>
    </div>
    <div class="lb-acts">
      <button class="lb-download-btn" id="lb-dl-btn" onclick="downloadCurrent()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>Download Original</span>
      </button>
      <button class="lb-btn" onclick="closeLb()" title="Close">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div id="lb-media-wrap"></div>
  <div class="lb-quality">
    <div class="lb-quality-dot"></div>
    <span id="lb-quality-txt">Original Quality</span>
  </div>
  <button class="lb-nav" id="lb-prev" onclick="lbMove(-1)">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <button class="lb-nav" id="lb-next" onclick="lbMove(1)">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-footer" id="lb-dots"></div>
</div>

<!-- ═══════════ SELECTION BAR ═══════════ -->
<div id="sel-bar">
  <span class="sel-n" id="sel-n">0 selected</span>
  <div class="sdiv"></div>
  <button class="sact dl" onclick="downloadSelected()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
    Download
  </button>
  <div class="sdiv"></div>
  <button class="scancel" onclick="clearSel()">Cancel</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg class="toast-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="toast-icon">
    <path stroke-linecap="round" d="M5 13l4 4L19 7"/>
  </svg>
  <span id="toast-msg"></span>
</div>

<script>
/* ══════════════════════════════════════════
   CONFIG — edit these after deployment
   ══════════════════════════════════════════ */
const CONFIG = {
  // The password your family uses to enter the gallery
  PASSWORD: "Vat02842@",

  // Your Cloudflare Worker URL (set up in Step 3 of README)
  // This worker fetches the signed URLs from Backblaze B2

/* ══════════════════════════════════════════
   AUTH
   ══════════════════════════════════════════ */
function doLogin(){
  const v = document.getElementById('pw-input').value;
  if(v === CONFIG.PASSWORD){
    sessionStorage.setItem('hx_auth', btoa(CONFIG.PASSWORD));
    showApp();
  } else {
    document.getElementById('login-err').classList.add('show');
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
function logout(){
  sessionStorage.removeItem('hx_auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
}
function checkAuth(){
  const stored = sessionStorage.getItem('hx_auth');
  if(stored && atob(stored) === CONFIG.PASSWORD) showApp();
}

/* ══════════════════════════════════════════

let allItems = [];
let filtered = [];
let selected = new Set();
let lbIdx = 0;
let currentTab = 'all';
let currentFilter = 'all';
let currentView = 'grid';

/* ══════════════════════════════════════════
   LOAD MEDIA from Cloudflare Worker
   ══════════════════════════════════════════ */
async function loadMedia(){
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="loading-state"><div class="spinner"></div><p style="margin-top:12px;font-size:13px">Loading your gallery…</p></div>`;
  try {
    const res = await fetch(`${CONFIG.WORKER_URL}/list`, {
      headers: { 'X-Gallery-Auth': btoa(CONFIG.PASSWORD) }
    });
    if(!res.ok) throw new Error('Auth failed');
    const data = await res.json();
    allItems = data.files || [];
    updateStats();
    render();
  } catch(e){
    // DEMO MODE — loads sample data when worker isn't configured yet
    allItems = getDemoData();
    updateStats();
    render();
    showToast('Demo mode — connect your Cloudflare Worker to load real files', 'err');
  }
}

/* ══════════════════════════════════════════
   STATS
   ══════════════════════════════════════════ */
function updateStats(){
  const photos = allItems.filter(i=>i.type==='photo').length;
  const videos = allItems.filter(i=>i.type==='video').length;
  const bytes = allItems.reduce((a,i)=>a+i.size,0);
  document.getElementById('s-total').textContent = allItems.length;
  document.getElementById('s-photos').textContent = photos;
  document.getElementById('s-videos').textContent = videos;
  const gb = bytes/1073741824;
  document.getElementById('s-size').textContent = gb>=1 ? gb.toFixed(1)+' GB' : (bytes/1048576).toFixed(0)+' MB';
}

/* ══════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════ */
function getFiltered(){
  const q = document.getElementById('search').value.toLowerCase();
  return allItems.filter(i=>{
    if(currentTab==='photos' && i.type!=='photo') return false;
    if(currentTab==='videos' && i.type!=='video') return false;
    if(currentFilter==='4k' && i.res!=='4K') return false;
    if(currentFilter==='hd' && i.res!=='HD') return false;
    if(q && !i.name.toLowerCase().includes(q)) return false;
    return true;
  });
}

function render(){
  filtered = getFiltered();
  const grid = document.getElementById('grid');
  const titles = {all:'All Media',photos:'Photos',videos:'Videos'};
  document.getElementById('sec-title').textContent = titles[currentTab];
  document.getElementById('sec-count').textContent = filtered.length + ' items';
  grid.className = 'grid'+(currentView==='list'?' list':'');
  if(!filtered.length){
    grid.innerHTML=`<div class="empty">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
      </svg>
      <h3>No media found</h3>
      <p>No files match your current filter.</p>
    </div>`;
    return;
  }
  grid.innerHTML = filtered.map((item,i)=>cardHTML(item,i)).join('');
}

function fmtSize(b){
  if(b>=1073741824) return (b/1073741824).toFixed(1)+' GB';
  return (b/1048576).toFixed(1)+' MB';
}

function cardHTML(item,idx){
  const sel = selected.has(item.id);
  const isVid = item.type==='video';
  const badge = item.res==='4K'
    ?`<div class="badge badge-4k">4K</div>`
    : isVid ? `<div class="badge badge-vid">▶ ${item.duration||''}</div>`
    :`<div class="badge badge-hd">HD</div>`;
  const icoView = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;
  const icoDl = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`;
  return `<div class="card${sel?' sel':''}" id="card-${item.id}">
    <div class="thumb-wrap${isVid?' thumb-vid':''}" onclick="openLb(${idx})">
      <img src="${item.thumb}" loading="lazy" alt="${item.name}"/>
      ${isVid?`<div class="play-over"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`:''}
      ${badge}
    </div>
    <div class="chk" onclick="toggleSel(event,'${item.id}')">${sel?`<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`:''}</div>
    <div class="card-info">
      <div class="card-name">${item.name}</div>
      <div class="card-meta">
        <span>${fmtSize(item.size)}</span>
        <span>${item.date}</span>
        ${item.res==='4K'?'<span style="color:var(--accent2)">4K</span>':''}
      </div>
      <div class="card-actions">
        <button class="ca-btn" onclick="openLb(${idx})">${icoView} View</button>
        <button class="ca-btn primary" onclick="downloadItem(event,'${item.id}')">${icoDl} Download</button>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════
   LIGHTBOX
   ══════════════════════════════════════════ */
function openLb(idx){
  lbIdx = idx;
  renderLb();
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lb-media-wrap').innerHTML='';
  document.body.style.overflow='';
}
function renderLb(){
  const item = filtered[lbIdx];
  if(!item) return;
  document.getElementById('lb-name').textContent = item.name;
  document.getElementById('lb-meta').textContent = `${item.res} • ${fmtSize(item.size)} • ${item.date}`;
  document.getElementById('lb-quality-txt').textContent = item.res==='4K' ? '4K Original Quality' : 'HD Original Quality';
  const wrap = document.getElementById('lb-media-wrap');
  if(item.type==='video'){
    wrap.innerHTML=`<video controls autoplay playsinline
      style="max-width:92vw;max-height:80vh;border-radius:10px;background:#000;outline:none">
      <source src="${item.url}" type="video/mp4"/>
      Your browser does not support video.
    </video>`;
  } else {
    wrap.innerHTML=`<img src="${item.url}" alt="${item.name}"
      style="max-width:92vw;max-height:80vh;border-radius:10px;object-fit:contain"/>`;
  }
  document.getElementById('lb-prev').style.display = lbIdx>0?'flex':'none';
  document.getElementById('lb-next').style.display = lbIdx<filtered.length-1?'flex':'none';
  const dots = document.getElementById('lb-dots');
  const total = Math.min(filtered.length, 9);
  const base = Math.max(0, Math.min(lbIdx - 4, filtered.length - total));
  dots.innerHTML = Array.from({length:total},(_,i)=>{
    const real = base+i;
    return `<div class="lb-dot${real===lbIdx?' active':''}" onclick="lbGoto(${real})"></div>`;
  }).join('');
}
function lbMove(d){
  lbIdx = Math.max(0,Math.min(filtered.length-1,lbIdx+d));
  document.getElementById('lb-media-wrap').innerHTML='';
  renderLb();
}
function lbGoto(i){ lbIdx=i; document.getElementById('lb-media-wrap').innerHTML=''; renderLb(); }
function downloadCurrent(){ downloadItem(null, filtered[lbIdx]?.id); }

/* ══════════════════════════════════════════
   DOWNLOAD — original quality
   ══════════════════════════════════════════ */
async function downloadItem(e, id){
  if(e) e.stopPropagation();
  const item = allItems.find(i=>i.id===id);
  if(!item) return;
  showToast(`Preparing download: ${item.name}…`, 'ok');
  try {
    // Try to get a signed download URL from worker
    let dlUrl = item.url;
    if(!CONFIG.WORKER_URL.includes('YOUR_SUBDOMAIN')){
      const res = await fetch(`${CONFIG.WORKER_URL}/download?id=${encodeURIComponent(id)}`,{
        headers:{'X-Gallery-Auth': btoa(CONFIG.PASSWORD)}
      });
      if(res.ok){ const d=await res.json(); dlUrl=d.url; }
    }
    const a = document.createElement('a');
    a.href = dlUrl;
    a.download = item.name + (item.type==='video'?'.mp4':'.jpg');
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast(`Downloading ${item.name}`, 'ok');
  } catch(err){
    showToast('Download failed. Try again.', 'err');
  }
}

async function downloadSelected(){
  const ids = [...selected];
  showToast(`Starting download of ${ids.length} file(s)…`, 'ok');
  for(const id of ids){ await downloadItem(null, id); await sleep(300); }
  clearSel();
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ══════════════════════════════════════════
   SELECTION
   ══════════════════════════════════════════ */
function toggleSel(e, id){
  e.stopPropagation();
  if(selected.has(id)) selected.delete(id);
  else selected.add(id);
  const card = document.getElementById('card-'+id);
  if(card){
    card.classList.toggle('sel', selected.has(id));
    const chk = card.querySelector('.chk');
    const svgCheck = `<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
    chk.innerHTML = selected.has(id) ? svgCheck : '';
  }
  const n = selected.size;
  document.getElementById('sel-bar').classList.toggle('on', n>0);
  document.getElementById('sel-n').textContent = n+' selected';
}
function clearSel(){
  selected.clear();
  document.getElementById('sel-bar').classList.remove('on');
  document.querySelectorAll('.card.sel').forEach(c=>{ c.classList.remove('sel'); c.querySelector('.chk').innerHTML=''; });
}

/* ══════════════════════════════════════════
   TABS / FILTERS / VIEW
   ══════════════════════════════════════════ */
function setTab(btn){
  currentTab = btn.dataset.tab;
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setFilter(btn){
  currentFilter = btn.dataset.f;
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setView(v){
  currentView = v;
  document.getElementById('vg').classList.toggle('active',v==='grid');
  document.getElementById('vl').classList.toggle('active',v==='list');
  render();
}

/* ══════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════ */
let toastTimer;
function showToast(msg, type='ok'){
  const t = document.getElementById('toast');
  const ico = document.getElementById('toast-icon');
  document.getElementById('toast-msg').textContent = msg;
  t.className = 'toast show '+(type==='err'?'err':'ok');
  ico.innerHTML = type==='err'
    ? `<path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/>`
    : `<path stroke-linecap="round" d="M5 13l4 4L19 7"/>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3000);
}

/* ══════════════════════════════════════════
   KEYBOARD
   ══════════════════════════════════════════ */
document.addEventListener('keydown', e=>{
  if(document.getElementById('lb').classList.contains('open')){
    if(e.key==='ArrowLeft') lbMove(-1);
    if(e.key==='ArrowRight') lbMove(1);
    if(e.key==='Escape') closeLb();
    if(e.key==='d') downloadCurrent();
  } else {
    if(e.key==='Escape') clearSel();
  }
  if(e.key==='Enter' && document.getElementById('login-screen').style.display!=='none') doLogin();
});

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  loadMedia();
}
checkAuth();
</script>
