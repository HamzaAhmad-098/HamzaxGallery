<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hamzax Family Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--border:#2a2a38;
  --accent:#c9a96e;--accent2:#7c6fcd;--text:#f0ede8;--muted:#7a7a8c;
  --danger:#e05555;--success:#4caf7d;--r:12px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:400px;text-align:center}
.login-logo{font-family:'Playfair Display',serif;font-size:28px;color:var(--accent);margin-bottom:6px}
.login-logo span{color:var(--text);font-weight:400}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.6}
.login-lock{width:56px;height:56px;margin:0 auto 24px;background:rgba(201,169,110,0.1);border-radius:16px;display:flex;align-items:center;justify-content:center}
.login-lock svg{width:26px;height:26px;color:var(--accent)}
.login-input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;text-align:center;letter-spacing:0.12em;outline:none;transition:border .2s;margin-bottom:14px}
.login-input:focus{border-color:var(--accent)}
.login-input::placeholder{letter-spacing:0;color:var(--muted)}
.login-btn{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#0a0a0f;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s}
.login-btn:hover{background:#d4b37a;transform:translateY(-1px)}
.login-error{margin-top:12px;font-size:13px;color:var(--danger);display:none}
.login-error.show{display:block}

/* ── APP SHELL ── */
#app{display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:12px}
.logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent)}
.logo span{color:var(--text);font-weight:400}
.nav-tabs{display:flex;gap:3px;background:var(--surface2);border-radius:10px;padding:3px}
.nav-tab{padding:7px 18px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s}
.nav-tab.active{background:var(--accent);color:#0a0a0f;font-weight:500}
.logout-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface)}
.stat{flex:1;padding:14px 20px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-val{display:block;font-size:20px;font-weight:600;color:var(--accent);font-family:'Playfair Display',serif}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:12px;padding:16px 24px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-input{width:100%;padding:9px 12px 9px 36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s}
.search-input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px}
.chip{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.chip.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.view-toggle{display:flex;gap:4px;background:var(--surface2);border-radius:8px;padding:3px}
.vbtn{width:32px;height:32px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.vbtn svg{width:16px;height:16px}
.vbtn.active{background:var(--surface);color:var(--text)}

/* ── GALLERY ── */
.gallery-wrap{padding:20px 24px}
.section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.section-title{font-family:'Playfair Display',serif;font-size:18px}
.section-badge{padding:3px 10px;border-radius:20px;background:var(--surface2);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.grid.list{grid-template-columns:1fr;gap:8px}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:all .2s;cursor:default;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card.sel{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.thumb-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface2);cursor:pointer}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;transition:opacity .3s;opacity:0}
.thumb-wrap img.loaded{opacity:1}
.thumb-skeleton{position:absolute;inset:0;background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.play-over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.play-over svg{width:44px;height:44px;color:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.badge{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.04em}
.badge-4k{background:var(--accent);color:#0a0a0f}
.badge-hd{background:rgba(0,0,0,.6);color:#fff}
.badge-vid{background:rgba(0,0,0,.6);color:#fff}
.chk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:6px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.chk svg{width:13px;height:13px;color:#fff}
.card.sel .chk{background:var(--accent2);border-color:var(--accent2)}
.card-info{padding:12px}
.card-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.card-meta{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:10px}
.card-actions{display:flex;gap:6px}
.ca-btn{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s}
.ca-btn svg{width:13px;height:13px}
.ca-btn:hover{border-color:var(--accent);color:var(--accent)}
.ca-btn.primary{background:var(--accent);color:#0a0a0f;border-color:var(--accent)}
.ca-btn.primary:hover{background:#d4b37a}

/* ── LIST VIEW ── */
.grid.list .card{display:flex;align-items:center;gap:16px;border-radius:10px}
.grid.list .thumb-wrap{width:80px;height:60px;flex-shrink:0;aspect-ratio:unset;border-radius:8px}
.grid.list .card-info{flex:1;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 0}
.grid.list .card-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0}
.grid.list .card-meta{margin-bottom:0;flex-shrink:0}
.grid.list .card-actions{flex-shrink:0;margin-bottom:0}

/* ── EMPTY / LOADING ── */
.empty,.loading-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);gap:12px;text-align:center}
.empty svg,.loading-state svg{width:48px;height:48px;opacity:.4}
.empty h3{font-size:16px;color:var(--text)}
.empty p{font-size:13px}

/* ── LIGHTBOX ── */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1000;display:none;flex-direction:column}
#lb.open{display:flex}
.lb-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-meta{font-size:12px;color:var(--muted);margin-top:2px}
.lb-acts{display:flex;gap:8px;flex-shrink:0}
.lb-btn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.lb-btn svg{width:16px;height:16px}
.lb-btn:hover{background:rgba(255,255,255,.12)}
.lb-download-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:rgba(201,169,110,.12);color:var(--accent);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.lb-download-btn svg{width:14px;height:14px}
.lb-download-btn:hover{background:var(--accent);color:#0a0a0f}
#lb-media-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
.lb-quality{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted)}
.lb-quality-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:10}
.lb-nav svg{width:20px;height:20px}
.lb-nav:hover{background:rgba(255,255,255,.15)}
#lb-prev{left:16px}
#lb-next{right:16px}
.lb-footer{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.lb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all .2s}
.lb-dot.active{background:var(--accent);transform:scale(1.4)}

/* ── SELECTION BAR ── */
#sel-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 20px;display:none;align-items:center;gap:12px;z-index:200}
#sel-bar.on{display:flex}
.sel-n{font-size:14px;font-weight:500}
.sdiv{flex:1}
.sact{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.sact.dl{background:var(--accent);color:#0a0a0f}
.sact.dl svg{width:14px;height:14px}
.scancel{padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}

/* ── DOWNLOAD BAR ── */
.dl-bar{position:fixed;top:0;left:0;right:0;background:var(--accent2);color:#fff;padding:10px 20px;display:none;align-items:center;gap:10px;font-size:13px;z-index:300;transform:translateY(-100%);transition:transform .3s}
.dl-bar.show{display:flex;transform:translateY(0)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:400}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--success)}
.toast.err{border-color:var(--danger)}
.toast-icon{width:14px;height:14px;flex-shrink:0}
.toast.ok .toast-icon{color:var(--success)}
.toast.err .toast-icon{color:var(--danger)}

@media(max-width:600px){
  header{padding:12px 16px}
  .stats-bar{overflow-x:auto}
  .stat{min-width:70px;padding:10px 12px}
  .gallery-wrap{padding:14px 12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .toolbar{padding:12px}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-lock">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path stroke-linecap="round" d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>
    <div class="login-logo">Hamzax <span>Gallery</span></div>
    <div class="login-sub">Family private gallery<br/>Enter the password to view photos &amp; videos</div>
    <input class="login-input" id="pw-input" type="password" placeholder="Enter password"
      onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Enter Gallery</button>
    <div class="login-error" id="login-err">Wrong password. Please try again.</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">Hamzax <span>Gallery</span></div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="all"    onclick="setTab(this)">All</button>
      <button class="nav-tab"        data-tab="photos" onclick="setTab(this)">Photos</button>
      <button class="nav-tab"        data-tab="videos" onclick="setTab(this)">Videos</button>
    </nav>
    <button class="logout-btn" onclick="logout()">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14">
        <path stroke-linecap="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>Logout
    </button>
  </header>

  <div class="stats-bar">
    <div class="stat"><span class="stat-val" id="s-total">—</span><span class="stat-label">Files</span></div>
    <div class="stat"><span class="stat-val" id="s-photos">—</span><span class="stat-label">Photos</span></div>
    <div class="stat"><span class="stat-val" id="s-videos">—</span><span class="stat-label">Videos</span></div>
    <div class="stat"><span class="stat-val" id="s-size">—</span><span class="stat-label">Total size</span></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
      </svg>
      <input class="search-input" id="search" placeholder="Search files…" oninput="render()"/>
    </div>
    <div class="chips">
      <button class="chip active" data-f="all" onclick="setFilter(this)">All</button>
      <button class="chip" data-f="4k"  onclick="setFilter(this)">4K</button>
      <button class="chip" data-f="hd"  onclick="setFilter(this)">HD</button>
    </div>
    <div class="view-toggle">
      <button class="vbtn active" id="vg" onclick="setView('grid')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="vbtn" id="vl" onclick="setView('list')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <div class="gallery-wrap">
    <div class="section-hdr">
      <span class="section-title" id="sec-title">All Media</span>
      <span class="section-badge" id="sec-count">0 items</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lb">
  <div class="lb-bar">
    <div class="lb-info">
      <div class="lb-name" id="lb-name"></div>
      <div class="lb-meta" id="lb-meta"></div>
    </div>
    <div class="lb-acts">
      <button class="lb-download-btn" onclick="downloadCurrent()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>Download</span>
      </button>
      <button class="lb-btn" onclick="closeLb()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div id="lb-media-wrap"></div>
  <div class="lb-quality"><div class="lb-quality-dot"></div><span id="lb-quality-txt">Original Quality</span></div>
  <button class="lb-nav" id="lb-prev" onclick="lbMove(-1)">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <button class="lb-nav" id="lb-next" onclick="lbMove(1)">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-footer" id="lb-dots"></div>
</div>

<!-- SELECTION BAR -->
<div id="sel-bar">
  <span class="sel-n" id="sel-n">0 selected</span>
  <div class="sdiv"></div>
  <button class="sact dl" onclick="downloadSelected()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
    Download Selected
  </button>
  <div class="sdiv"></div>
  <button class="scancel" onclick="clearSel()">Cancel</button>
</div>

<!-- DOWNLOAD PROGRESS -->
<div class="dl-bar" id="dl-bar">
  <div class="spinner"></div>
  <span id="dl-msg">Downloading…</span>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg class="toast-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="toast-icon">
    <path stroke-linecap="round" d="M5 13l4 4L19 7"/>
  </svg>
  <span id="toast-msg"></span>
</div>

<script>
/* ══════════════════════════════════════════
   CONFIG — set your values here
══════════════════════════════════════════ */
const CONFIG = {
  PASSWORD:   'Vat02842@',
  WORKER_URL: 'https://gentle-bread-3cb2.jhaji1223.workers.dev',
};

/* ══════════════════════════════════════════
   AUTH
══════════════════════════════════════════ */
function doLogin() {
  const v = document.getElementById('pw-input').value;
  if (v === CONFIG.PASSWORD) {
    sessionStorage.setItem('hx_auth', btoa(v));
    showApp();
  } else {
    document.getElementById('login-err').classList.add('show');
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
function logout() {
  sessionStorage.removeItem('hx_auth');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
}
function checkAuth() {
  const s = sessionStorage.getItem('hx_auth');
  if (s && atob(s) === CONFIG.PASSWORD) showApp();
}
const authHdr = () => ({ 'X-Gallery-Auth': btoa(CONFIG.PASSWORD) });

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let allItems = [], filtered = [], selected = new Set();
let lbIdx = 0, currentTab = 'all', currentFilter = 'all', currentView = 'grid';
const W = CONFIG.WORKER_URL;

/* ══════════════════════════════════════════
   LOAD MEDIA
══════════════════════════════════════════ */
async function loadMedia() {
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="loading-state"><div class="spinner"></div><p style="margin-top:12px;font-size:13px;color:var(--muted)">Loading your gallery…</p></div>`;
  try {
    const res = await fetch(`${W}/list`, { headers: authHdr() });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    allItems = data.files || [];
    updateStats();
    render();
  } catch(e) {
    grid.innerHTML = `<div class="empty">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
      <h3>Could not load gallery</h3>
      <p>${e.message}</p>
      <button onclick="loadMedia()" style="margin-top:16px;padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif">Retry</button>
    </div>`;
  }
}

/* ══════════════════════════════════════════
   STATS
══════════════════════════════════════════ */
function updateStats() {
  const ph = allItems.filter(i => i.type === 'photo').length;
  const vi = allItems.filter(i => i.type === 'video').length;
  const by = allItems.reduce((a, i) => a + i.size, 0);
  document.getElementById('s-total').textContent  = allItems.length;
  document.getElementById('s-photos').textContent = ph;
  document.getElementById('s-videos').textContent = vi;
  const gb = by / 1073741824;
  document.getElementById('s-size').textContent = gb >= 1 ? gb.toFixed(1) + ' GB' : (by / 1048576).toFixed(0) + ' MB';
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  return allItems.filter(i => {
    if (currentTab === 'photos' && i.type !== 'photo') return false;
    if (currentTab === 'videos' && i.type !== 'video') return false;
    if (currentFilter === '4k' && i.res !== '4K') return false;
    if (currentFilter === 'hd' && i.res !== 'HD') return false;
    if (q && !i.name.toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  filtered = getFiltered();
  const grid = document.getElementById('grid');
  document.getElementById('sec-title').textContent = { all: 'All Media', photos: 'Photos', videos: 'Videos' }[currentTab];
  document.getElementById('sec-count').textContent = filtered.length + ' items';
  grid.className = 'grid' + (currentView === 'list' ? ' list' : '');

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>
      <h3>No media found</h3><p>No files match your current filter.</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map((item, i) => cardHTML(item, i)).join('');

  // Lazy load with IntersectionObserver
  grid.querySelectorAll('img[data-src]').forEach(img => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const el = e.target;
          el.src = el.dataset.src;
          el.onload  = () => { el.classList.add('loaded'); el.previousElementSibling?.remove(); };
          el.onerror = () => { el.classList.add('loaded'); };
          obs.unobserve(el);
        }
      });
    }, { rootMargin: '300px' });
    obs.observe(img);
  });
}

function fmtSize(b) {
  return b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' GB' : (b / 1048576).toFixed(1) + ' MB';
}

function cardHTML(item, idx) {
  const sel   = selected.has(item.id);
  const isVid = item.type === 'video';
  const badge = item.res === '4K'
    ? `<div class="badge badge-4k">4K</div>`
    : isVid
      ? `<div class="badge badge-vid">▶</div>`
      : `<div class="badge badge-hd">HD</div>`;

  const iV = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;
  const iD = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`;

  // Thumbnail and media routed through Worker /proxy
  const thumbSrc = `${W}/proxy${item.thumb}`;

  return `<div class="card${sel ? ' sel' : ''}" id="card-${item.id}">
    <div class="thumb-wrap" onclick="openLb(${idx})">
      <div class="thumb-skeleton"></div>
      <img data-src="${thumbSrc}" src="" alt="${item.name}" decoding="async"/>
      ${isVid ? `<div class="play-over"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>` : ''}
      ${badge}
    </div>
    <div class="chk" onclick="toggleSel(event,'${item.id}')">${sel ? `<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}</div>
    <div class="card-info">
      <div class="card-name">${item.name}</div>
      <div class="card-meta"><span>${fmtSize(item.size)}</span><span>${item.date}</span>${item.res === '4K' ? '<span style="color:var(--accent2)">4K</span>' : ''}</div>
      <div class="card-actions">
        <button class="ca-btn" onclick="openLb(${idx})">${iV} View</button>
        <button class="ca-btn primary" onclick="downloadItem(event,'${item.id}')">${iD} Download</button>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════
   LIGHTBOX
══════════════════════════════════════════ */
function openLb(idx) {
  lbIdx = idx;
  renderLb();
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lb-media-wrap').innerHTML = '';
  document.body.style.overflow = '';
}
function renderLb() {
  const item = filtered[lbIdx];
  if (!item) return;
  document.getElementById('lb-name').textContent = item.name;
  document.getElementById('lb-meta').textContent = `${item.res} • ${fmtSize(item.size)} • ${item.date}`;
  document.getElementById('lb-quality-txt').textContent = item.res === '4K' ? '4K Original Quality' : 'HD Original Quality';

  const wrap = document.getElementById('lb-media-wrap');
  // Media streamed through Worker /proxy — no CORS, no B2 login popup
  const mediaSrc = `${W}/proxy${item.url}`;

  if (item.type === 'video') {
    wrap.innerHTML = `<video controls autoplay playsinline preload="metadata"
      style="max-width:92vw;max-height:80vh;border-radius:10px;background:#000;outline:none">
      <source src="${mediaSrc}"/>Your browser does not support video.
    </video>`;
  } else {
    wrap.innerHTML = `<img src="${mediaSrc}" alt="${item.name}"
      style="max-width:92vw;max-height:80vh;border-radius:10px;object-fit:contain"/>`;
  }

  document.getElementById('lb-prev').style.display = lbIdx > 0 ? 'flex' : 'none';
  document.getElementById('lb-next').style.display = lbIdx < filtered.length - 1 ? 'flex' : 'none';

  const total = Math.min(filtered.length, 9);
  const base  = Math.max(0, Math.min(lbIdx - 4, filtered.length - total));
  document.getElementById('lb-dots').innerHTML = Array.from({ length: total }, (_, i) => {
    const r = base + i;
    return `<div class="lb-dot${r === lbIdx ? ' active' : ''}" onclick="lbGoto(${r})"></div>`;
  }).join('');
}
function lbMove(d) {
  lbIdx = Math.max(0, Math.min(filtered.length - 1, lbIdx + d));
  document.getElementById('lb-media-wrap').innerHTML = '';
  renderLb();
}
function lbGoto(i) {
  lbIdx = i;
  document.getElementById('lb-media-wrap').innerHTML = '';
  renderLb();
}
function downloadCurrent() { downloadItem(null, filtered[lbIdx]?.id); }

/* ══════════════════════════════════════════
   DOWNLOAD — streamed through Worker /download
   No CORS, no B2 login popup, saves directly
══════════════════════════════════════════ */
async function downloadItem(e, id) {
  if (e) e.stopPropagation();
  const item = allItems.find(i => i.id === id);
  if (!item) return;

  showDl(`Downloading ${item.name}…`);
  try {
    const res = await fetch(`${W}/download?id=${encodeURIComponent(id)}`, { headers: authHdr() });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = item.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    hideDl();
    showToast(`Saved: ${item.name}`, 'ok');
  } catch(err) {
    hideDl();
    showToast(`Download failed: ${err.message}`, 'err');
  }
}

async function downloadSelected() {
  for (const id of [...selected]) {
    await downloadItem(null, id);
    await new Promise(r => setTimeout(r, 600));
  }
  clearSel();
}

/* ══════════════════════════════════════════
   SELECTION
══════════════════════════════════════════ */
function toggleSel(e, id) {
  e.stopPropagation();
  selected.has(id) ? selected.delete(id) : selected.add(id);
  const card = document.getElementById('card-' + id);
  if (card) {
    card.classList.toggle('sel', selected.has(id));
    card.querySelector('.chk').innerHTML = selected.has(id)
      ? `<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`
      : '';
  }
  const n = selected.size;
  document.getElementById('sel-bar').classList.toggle('on', n > 0);
  document.getElementById('sel-n').textContent = n + ' selected';
}
function clearSel() {
  selected.clear();
  document.getElementById('sel-bar').classList.remove('on');
  document.querySelectorAll('.card.sel').forEach(c => {
    c.classList.remove('sel');
    c.querySelector('.chk').innerHTML = '';
  });
}

/* ══════════════════════════════════════════
   TABS / FILTERS / VIEW
══════════════════════════════════════════ */
function setTab(btn) {
  currentTab = btn.dataset.tab;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setFilter(btn) {
  currentFilter = btn.dataset.f;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setView(v) {
  currentView = v;
  document.getElementById('vg').classList.toggle('active', v === 'grid');
  document.getElementById('vl').classList.toggle('active', v === 'list');
  render();
}

/* ══════════════════════════════════════════
   UI HELPERS
══════════════════════════════════════════ */
function showDl(msg) {
  document.getElementById('dl-msg').textContent = msg;
  document.getElementById('dl-bar').classList.add('show');
}
function hideDl() {
  document.getElementById('dl-bar').classList.remove('show');
}
let _tt;
function showToast(msg, type = 'ok') {
  const t  = document.getElementById('toast');
  const ic = document.getElementById('toast-icon');
  document.getElementById('toast-msg').textContent = msg;
  t.className = 'toast show ' + (type === 'err' ? 'err' : 'ok');
  ic.innerHTML = type === 'err'
    ? `<path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/>`
    : `<path stroke-linecap="round" d="M5 13l4 4L19 7"/>`;
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ══════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (document.getElementById('lb').classList.contains('open')) {
    if (e.key === 'ArrowLeft')  lbMove(-1);
    if (e.key === 'ArrowRight') lbMove(1);
    if (e.key === 'Escape')     closeLb();
    if (e.key === 'd' || e.key === 'D') downloadCurrent();
  } else if (e.key === 'Escape') clearSel();
});

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadMedia();
}
checkAuth();
</script>
</body>
</html>
